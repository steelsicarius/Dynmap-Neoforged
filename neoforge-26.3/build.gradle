plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.gradleup.shadow' version '9.4.2'
    id 'idea'
}

// Upstream dynmap (v3.0 branch): group us.dynmap, version 3.9-SNAPSHOT.
version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// ---------------------------------------------------------------------------
// DynmapCore + DynmapCoreAPI are compiled in place from the dynmap repo this
// module lives in (this folder is a sibling of DynmapCore, like forge-1.19.3),
// so the sources resolve the same way in both supported layouts:
//   - integrated:  ./gradlew :neoforge-26.1.2:build   (from the repo root)
//   - standalone:  cd neoforge-26.1.2 && ./gradlew build (own wrapper)
// Unlike the upstream platform modules (which consume :DynmapCore as a shaded
// project dependency), everything is a single self-contained jar here.
// ---------------------------------------------------------------------------
def originDir = layout.projectDirectory.dir('..')

sourceSets.main.java {
    srcDir originDir.dir('DynmapCoreAPI/src/main/java')
    srcDir originDir.dir('DynmapCore/src/main/java')
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    // DynmapCore resources (configuration templates, extracted web client...).
    srcDir originDir.dir('DynmapCore/src/main/resources')
    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()
}

// ---------------------------------------------------------------------------
// Dependencies
//
// The third-party libraries DynmapCore needs are shaded into the final mod
// jar (with the same relocations the upstream DynmapCore shadow jar applies),
// so the port is a single self-contained jar, just like upstream Dynmap.
//
//  - libs/*.jar: s3lite (AWS S3 client used by the aws_s3 storage backend).
//    The upstream coordinates io.github.linktosriram.s3lite:0.0.2-SNAPSHOT
//    are no longer resolvable (OSSRH sunset + project removed from GitHub);
//    the jars here were rebuilt from the original source (MIT license, see
//    libs/s3lite-LICENSE) - see reference/s3-lite in the workspace.
//  - luckperms / jsr305: compile-only (optional permission provider /
//    annotations), mirroring the upstream Fabric module.
// ---------------------------------------------------------------------------
def shadedConfig = configurations.create('shaded')
configurations {
    compileOnly { extendsFrom shadedConfig }
    runtimeOnly { extendsFrom shadedConfig }
}

// Guava is provided by Minecraft's own classpath at runtime, but must not be
// *bundled* by us (Minecraft ships its own copy). The same applies to junit,
// which leaks in through the ancient json-simple 1.1.1 pom. Both are filtered
// at shadowJar level (see below); a configuration-level exclusion would
// erroneously remove Minecraft's own guava from the compile classpath too.

dependencies {
    // DynmapCore third-party libraries (see upstream DynmapCore/build.gradle).
    shaded 'javax.servlet:javax.servlet-api:3.1'
    shaded 'org.eclipse.jetty:jetty-server:9.4.26.v20200117'
    shaded 'org.eclipse.jetty:jetty-servlet:9.4.26.v20200117'
    shaded 'com.googlecode.json-simple:json-simple:1.1.1'
    shaded 'org.yaml:snakeyaml:1.23' // DON'T UPDATE - NEWER ONE TRIPS ON WINDOWS ENCODED FILES
    shaded 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20180219.1'
    shaded 'org.postgresql:postgresql:42.2.18'
    shaded fileTree(dir: 'libs', include: ['api-0.0.2-SNAPSHOT.jar',
                                           'core-0.0.2-SNAPSHOT.jar',
                                           'util-0.0.2-SNAPSHOT.jar',
                                           'http-client-spi-0.0.2-SNAPSHOT.jar',
                                           'http-client-url-connection-0.0.2-SNAPSHOT.jar'])

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly "net.luckperms:api:${luckperms_version}"
    // Guava is shipped by Minecraft itself at runtime (26.1.2 bundles guava
    // 33.5.0-jre), it just is not on ModDevGradle's compile classpath.
    compileOnly 'com.google.guava:guava:33.5.0-jre'
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // Access Transformers are automatically detected
    // (src/main/resources/META-INF/accesstransformer.cfg)

    runs {
        server {
            server()
            programArgument '--nogui'
            // Deterministic test port (25565 is taken on this host).
            programArgument '--port'
            programArgument '25599'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // This host has no IPv6 stack; MC binds both by default.
            systemProperty 'java.net.preferIPv4Stack', 'true'
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'java.net.preferIPv4Stack', 'true'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            gameDirectory = project.file('run')
        }
    }

    mods {
        // define mod <-> source bindings
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Replicates the upstream DynmapCore processResources expansion: ${version}
// and ${buildnumber} are stamped into the bundled configuration and web files.
tasks.named('processResources', ProcessResources).configure {
    def buildnumber = providers.environmentVariable('BUILD_NUMBER').getOrElse('Dev')
    def versionStr = project.version.toString()
    inputs.property('buildnumber', buildnumber)
    filesMatching(['core.yml', 'lightings.txt', 'perspectives.txt', 'shaders.txt',
                   'extracted/web/version.js', 'extracted/web/index.html', 'extracted/web/login.html']) {
        expand version: versionStr, buildnumber: buildnumber
    }
}

// ---------------------------------------------------------------------------
// Shadow: bundle + relocate the third-party libraries (same relocations as
// the upstream DynmapCore shadow jar, which all platform builds embed).
// ---------------------------------------------------------------------------
shadowJar {
    archiveClassifier.set('dev-shadow')
    // Keep the intermediate shadow jar OUT of build/libs so it cannot be
    // mistaken for the real mod jar.
    destinationDirectory = layout.buildDirectory.dir('shadow')
    configurations = [shadedConfig]

    mergeServiceFiles()

    // Libraries the game ships itself at runtime must never be bundled: a
    // second, older copy on the mod's classpath shadows the game's own one.
    // This actually broke MC 26.1.2 dedicated servers with
    // NoSuchMethodError: ImmutableMap$Builder.buildOrThrow() (the game's
    // BlockStateProperties resolved the OLD bundled Guava). Note Guava
    // classes live under com/google/common, NOT com/google/guava.
    //  - guava + checker-qual: transitively pulled by owasp-java-html-sanitizer
    //  - hamcrest/junit: leak through json-simple 1.1.1's ancient pom
    // Same intent as upstream: DynmapCore's shadowJar include-allowlist and
    // the fabric module's "it.toString().contains(\"guava\")" filter.
    exclude 'com/google/common/**'
    exclude 'com/google/thirdparty/**'
    exclude 'com/google/errorprone/**'
    exclude 'org/checkerframework/**'
    exclude 'org/hamcrest/**'
    exclude 'junit/**'
    exclude 'org/junit/**'
    // Maven metadata noise (upstream drops it too).
    exclude 'META-INF/maven/**'

    relocate 'org.json.simple', 'org.dynmap.json.simple'
    relocate 'org.yaml.snakeyaml', 'org.dynmap.snakeyaml'
    relocate 'org.eclipse.jetty', 'org.dynmap.jetty'
    relocate 'org.owasp.html', 'org.dynmap.org.owasp.html'
    relocate 'javax.servlet', 'org.dynmap.javax.servlet'
    relocate 'org.postgresql', 'org.dynmap.org.postgresql'
    relocate 'io.github.linktosriram.s3lite', 'org.dynmap.s3lite'

    // Main sourceset (platform code + DynmapCore + DynmapCoreAPI): shadow
    // rewrites the references to the relocated packages inside them too.
    from sourceSets.main.output
}

// ---------------------------------------------------------------------------
// Final jar: shadow output + LICENSE, published as Dynmap-<ver>-neoforge-<mc>.jar
// ---------------------------------------------------------------------------
jar {
    dependsOn tasks.shadowJar
    from('LICENSE')
    from(zipTree(tasks.shadowJar.archiveFile)) {
        exclude('META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
    }
    def mainOutputDirs = sourceSets.main.output.files
    exclude { element ->
        mainOutputDirs.any { element.file.toPath().startsWith(it.toPath()) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "Dynmap-${mod_version}-neoforge-${minecraft_version}.jar"
    // Upstream platform modules publish into the repo root target/ dir
    // (collected by CI: artifacts: target/*.jar).
    destinationDirectory = file('../target')
}

jar.doLast {
    task -> ant.checksum file: task.archiveFile.get().asFile
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
